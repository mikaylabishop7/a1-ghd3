<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
const svg = d3.select("#container") .append("svg") .attr("width", 800) .attr("height", 500) .style ("background-color", "#081b33");

    //rectangles (plants)
svg.append("rect") .attr("x", 100) .attr("y", 400) .attr("width", 14) .attr("height", 80) .attr("rx", 7) .attr("fill", "#2dd4bf");
svg.append("rect") .attr("x", 125) .attr("y", 430) .attr("width", 14) .attr("height", 50) .attr("rx", 7) .attr("fill","#5eead4"); 
  
    //circles (bubbles)                                                      
svg.append("circle") .attr("cx", 120) .attr("cy", 280) .attr("r", 12) .attr("fill", "none") .attr("stroke", "#67e8f9") .attr("stroke-width", 2); 
svg.append("circle") .attr("cx", 430) .attr("cy", 150) .attr("r", 20) .attr("fill", "none") .attr("stroke", "#c084fc") .attr("stroke-width", 2); 
svg.append("circle") .attr("cx", 190) .attr("cy", 90) .attr("r", 8) .attr("fill", "none") .attr("stroke", "#f9a8d4") .attr("stroke-width", 2)

    //lines (teneticals)
svg.append("line") .attr("x1", 225) .attr("y1", 220) .attr("x2",225) .attr("y2", 370) .attr("stroke", "#f9a8d4") .attr("stroke-width", 5);
svg.append("line") .attr("x1", 280) .attr("y1", 220) .attr("x2", 280) .attr("y2", 410) .attr("stroke", "#c084fc") .attr("stroke-width", 5); 
svg.append("line") .attr("x1", 335) .attr("y1", 220) .attr("x2", 335) .attr("y2", 370) .attr("stroke", "#67e8f9") .attr("stroke-width", 5); 

    //polygone (rock and jellyfish body)
svg.append("polygon") .attr("points", "320, 480 305, 445 340, 410 400, 400 455, 430 480, 480") .attr("fill", "#64748b") .attr("stroke", "#94a3b8") .attr("stroke-width", 2);     
svg.append("path") .attr("d", "M 200 220 A 80 80 0 0 1 360 220 Z") .attr ("fill", "#c084fc") .attr("stroke", "#e9d5ff") .attr("stroke-width", 3); 
  </script>
</body>
</html>
